{% extends "base.html" %}
{% block title %}Prediction | Mental Health ML{% endblock %}
{% block content %}
<h2 class="mb-2">Student Risk Prediction</h2>
<p class="text-muted mb-4">Enter the student's information and submit the form.</p>

<form id="predictionForm" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">Gender</label>
        <select name="Gender" class="form-select" required>
            <option value="">Select</option>
            <option>Female</option>
            <option>Male</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Age</label>
        <input name="Age" type="number" min="10" max="100" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Academic Year</label>
        <select name="Academic_Year" class="form-select" required>
            <option>1st</option>
            <option>2nd</option>
            <option>3rd</option>
            <option>4th</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Sleep Hours</label>
        <input name="Sleep_Hours" type="number" min="0" max="24" step="0.1" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Social Media Usage</label>
        <select name="Social_Media_Usage" class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Exercise</label>
        <select name="Exercise" class="form-select" required>
            <option>Yes</option>
            <option>No</option>
        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Smoking</label>
        <select name="Smoking" class="form-select" required>
            <option>No</option>
            <option>Yes</option>
        </select>
    </div>

    <div class="col-md-4"><label class="form-label">Academic Pressure</label><select name="Academic_Pressure"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Academic Satisfaction</label><select name="Academic_Satisfaction"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Career Concern</label><select name="Career_Concern"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Financial Stress</label><select name="Financial_Stress"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Family Pressure</label><select name="Family_Pressure"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Feeling Depressed</label><select name="Feeling_Depressed"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Feeling Anxious</label><select name="Feeling_Anxious"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Feeling Stressed</label><select name="Feeling_Stressed"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Difficulty Concentrating</label><select
            name="Difficulty_Concentrating" class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Feeling Lonely</label><select name="Feeling_Lonely"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>
    <div class="col-md-4"><label class="form-label">Feeling Isolated</label><select name="Feeling_Isolated"
            class="form-select" required>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select></div>

    <div class="col-12 mt-4">
        <button class="btn btn-primary btn-lg" type="submit">Predict Risk</button>
    </div>
</form>

<div id="loading" class="alert alert-info mt-4 d-none">Predicting...</div>
<div id="error" class="alert alert-danger mt-4 d-none"></div>

<div id="result" class="card shadow-sm mt-4 d-none">
    <div class="card-body">
        <h3 id="riskTitle"></h3>
        <p id="confidence" class="lead"></p>
        <h5>Recommendations</h5>
        <ul id="recommendations"></ul>
    </div>
</div>

<script>
    document.getElementById("predictionForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const form = e.target;
        const data = Object.fromEntries(new FormData(form).entries());

        // Convert numeric fields
        data.Age = Number(data.Age);
        data.Sleep_Hours = Number(data.Sleep_Hours);

        // Show loading
        document.getElementById("loading").classList.remove("d-none");
        document.getElementById("error").classList.add("d-none");
        document.getElementById("result").classList.add("d-none");

        try {
            const response = await fetch("/api/predict/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(data)
            });

            // First check response content type
            const contentType = response.headers.get("content-type") || "";

            let payload;

            if (contentType.includes("application/json")) {
                payload = await response.json();
            } else {
                // Backend returned HTML instead of JSON
                const text = await response.text();

                console.error("Server returned non-JSON response:", text);

                throw new Error(
                    `Server returned ${response.status} ${response.statusText}. ` +
                    `Expected JSON but received HTML. Check /api/predict/ URL and Django backend.`
                );
            }

            console.log("API Response:", payload);

            // Handle API error
            if (!response.ok) {
                const errorMessage =
                    payload.detail ||
                    payload.error ||
                    payload.message ||
                    JSON.stringify(payload);

                throw new Error(errorMessage);
            }

            // Prediction
            document.getElementById("riskTitle").textContent =
                payload.prediction || "Prediction unavailable";

            // Confidence
            if (
                payload.confidence !== null &&
                payload.confidence !== undefined
            ) {
                document.getElementById("confidence").textContent =
                    `Model confidence: ${payload.confidence}%`;
            } else {
                document.getElementById("confidence").textContent =
                    "Confidence unavailable";
            }

            // Recommendations
            const ul = document.getElementById("recommendations");
            ul.innerHTML = "";

            if (
                Array.isArray(payload.recommendations) &&
                payload.recommendations.length > 0
            ) {
                payload.recommendations.forEach(function (item) {
                    const li = document.createElement("li");
                    li.textContent = item;
                    ul.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.textContent = "No specific recommendations available.";
                ul.appendChild(li);
            }

            // Show result
            document.getElementById("result").classList.remove("d-none");

        } catch (error) {
            console.error("Prediction Error:", error);

            document.getElementById("error").textContent =
                error.message || "Something went wrong.";

            document.getElementById("error").classList.remove("d-none");

        } finally {
            // Hide loading
            document.getElementById("loading").classList.add("d-none");
        }
    });
</script>

{% endblock %}
