{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mental Health Risk Prediction{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Mental Health ML</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" href="/predict/">Predict</a>
            <a class="btn btn-outline-light btn-sm" href="/comparison/">Model Comparison</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

<footer class="border-top py-4 text-center text-muted">
    <small>Research/demo system — not a medical diagnosis.</small>
</footer>
</body>
</html>
